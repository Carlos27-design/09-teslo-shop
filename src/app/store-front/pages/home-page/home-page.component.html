<h1 class="text-3xl font-bold font-montserrat">
  Todos los productos{{ paginationService.currentPage() }}
</h1>
<h2 class="text-xl">Para todos los gustos</h2>

<div class="divider"></div>

<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-3 gap-3"
>
  @for (product of productsResource.value()?.products; track $index) {
  <product-card [product]="product" />
  }

  <!-- Empty -->

  @empty {
  <p>No se encuentran productos</p>
  }
</div>

<div class="flex justify-center items-center mt-2 mb-10">
  <app-pagination
    [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />
</div>
